name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The newest Go patch release (stdlib security fixes); go.mod only
          # sets the minimum.
          go-version: "1.26"
          check-latest: true

      - name: Vet
        run: go vet ./...

      # Fails on vulnerabilities in code paths rgstr actually calls.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test -race -count=1 ./...

  # The cluster mode against real PostgreSQL and S3 (SeaweedFS): the
  # database layer, the S3 storage driver, and three rgstr processes under
  # load while they are killed and restarted.
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Start PostgreSQL and SeaweedFS
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=rgstr postgres:16-alpine
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"cikey","secretKey":"cisecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 9000:8333 -v /tmp/s3.json:/etc/s3.json:ro chrislusf/seaweedfs:latest server -s3 -s3.config=/etc/s3.json
          # Steps run with bash -e: commands that fail while the services
          # start must not end the step (|| true).
          for i in $(seq 60); do
            pg=$(docker exec pg pg_isready -U postgres >/dev/null 2>&1 && echo ok || true)
            s3=$(curl -s -o /dev/null -w '%{http_code}' localhost:9000/ || true)
            [ "$pg" = ok ] && [ "$s3" != 000 ] && [ -n "$s3" ] && break
            sleep 1
          done
          for i in $(seq 30); do
            docker exec s3 sh -c 'echo "s3.bucket.create -name rgstr-test" | weed shell' 2>/dev/null \
              | grep -q 'created bucket' && break || true
            sleep 2
          done
          curl -s -o /dev/null -w 'S3 answers %{http_code}\n' localhost:9000/

      - name: Cluster tests
        env:
          RGSTR_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/rgstr?sslmode=disable
          RGSTR_TEST_S3: http://localhost:9000
          RGSTR_TEST_S3_KEY: cikey
          RGSTR_TEST_S3_SECRET: cisecret
          RGSTR_TEST_HA_DURATION: 30s
        run: go test -count=1 -timeout 15m -v ./internal/db ./internal/storage ./internal/backup ./test/ha

  # Vulnerability scanning with the Trivy built into the image: an old
  # Alpine with known critical vulnerabilities is pushed, scanned, and then
  # refused by the project's policy.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t rgstr:ci .

      - name: Push, scan, refuse
        run: |
          docker run -d --name rgstr -p 5000:5000 -e RGSTR_SCAN_ENABLED=true rgstr:ci
          for i in $(seq 30); do curl -fs localhost:5000/healthz >/dev/null && break || true; sleep 1; done
          curl -fs -X POST -H 'Content-Type: application/json' \
            -d '{"name":"team","block_severity":"critical"}' localhost:5000/ui/api/projects/create
          docker pull -q alpine:3.10
          docker tag alpine:3.10 localhost:5000/team/old:3.10
          docker push -q localhost:5000/team/old:3.10
          status=
          for i in $(seq 120); do
            status=$(curl -fs 'localhost:5000/ui/api/scan?repo=team/old&ref=3.10' | jq -r '.summary.status // "none"' || true)
            [ "$status" = done ] || [ "$status" = error ] && break
            sleep 5
          done
          curl -fs 'localhost:5000/ui/api/scan?repo=team/old&ref=3.10' | jq '.summary'
          [ "$status" = done ] || { docker logs rgstr | tail -30; exit 1; }
          critical=$(curl -fs 'localhost:5000/ui/api/scan?repo=team/old&ref=3.10' | jq '.summary.counts.critical // 0')
          [ "$critical" -gt 0 ] || { echo "no critical vulnerabilities found in alpine:3.10"; exit 1; }
          docker rmi localhost:5000/team/old:3.10 alpine:3.10
          if docker pull localhost:5000/team/old:3.10 2>pull.err; then echo "the policy did not refuse the pull"; exit 1; fi
          grep -q vulnerabilities pull.err && echo "pull refused: $(cat pull.err)"
