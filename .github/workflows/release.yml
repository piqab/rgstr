name: Release

# push to main → image ghcr.io/<owner>/rgstr:main
# tag v1.2.3   → GitHub Release with binaries + images :1.2.3, :1.2, :latest
# The version lives in the VERSION file; the tag must be v$(cat VERSION).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file ($want)"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          # The newest Go patch release (stdlib security fixes); go.mod only
          # sets the minimum.
          go-version: "1.26"
          check-latest: true
      - run: go test -race -count=1 ./...

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The newest Go patch release (stdlib security fixes); go.mod only
          # sets the minimum.
          go-version: "1.26"
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="v$(cat VERSION)"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o rgstr .
          go build -trimpath -ldflags="-s -w" -o mkpasswd ./cmd/mkpasswd

      - name: Package
        id: pkg
        run: |
          name="rgstr-${GITHUB_REF_NAME}-linux-${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          cp rgstr mkpasswd README.md README.ru.md LICENSE .env.example docker-compose.yml "dist/${name}/"
          cp -r deploy "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # Bare binaries alongside the archive, for a plain download.
          cp rgstr "dist/rgstr-linux-${{ matrix.goarch }}"
          cp mkpasswd "dist/mkpasswd-linux-${{ matrix.goarch }}"
          (cd dist && for f in "${name}.tar.gz" rgstr-linux-* mkpasswd-linux-*; do
            sha256sum "$f" > "$f.sha256"
          done)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/${{ steps.pkg.outputs.name }}.tar.gz.sha256
            dist/rgstr-linux-${{ matrix.goarch }}
            dist/rgstr-linux-${{ matrix.goarch }}.sha256
            dist/mkpasswd-linux-${{ matrix.goarch }}
            dist/mkpasswd-linux-${{ matrix.goarch }}.sha256

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: ver
        run: |
          v="v$(cat VERSION)"
          # Builds from main carry the commit, so they are not mistaken for a release.
          case "$GITHUB_REF" in refs/tags/v*) ;; *) v="${v}-main.${GITHUB_SHA::7}" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # :latest goes only to semver tags (the latest release)
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
