# fail2ban filter for rgstr: failed sign-ins (docker login, web admin,
# password change) recorded in <RGSTR_STORAGE>/audit.log.
#
# A line looks like:
# {"time":"2026-10-08T10:44:00.1Z","user":"admin","ip":"203.0.113.7","action":"login_failed","detail":"docker"}
#
# fail2ban cuts the matched date ({"time":"2026-10-08T10:44:00) out of the
# line before applying failregex, so failregex starts at the fractional
# seconds. The user name is chosen by the client; it is JSON-escaped, so
# it is matched as an escaped string and cannot inject a fake "ip" field.

[Definition]

failregex = ^(?:\.\d+)?Z","user":"(?:[^"\\]|\\.)*","ip":"<HOST>","action":"login_failed"

ignoreregex =

datepattern = ^\{"time":"%%Y-%%m-%%dT%%H:%%M:%%S
